services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    container_name: ${COMPOSE_LEAD}-${COMPOSE_NAME}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-changeme}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    deploy:
      resources:
        limits:
          cpus: ${COMPOSE_CPUS}
          memory: ${COMPOSE_MEMO}
    volumes:
      - .${COMPOSE_PROJECT_DATA}:/usr/share/elasticsearch/data
    restart: unless-stopped

volumes:
  elasticsearch-data:
    driver: local
